# Self-tracked Integration Quality Scale checklist.
# The scale is not enforced for custom integrations; it is used here as the
# definition of "done" for each release. Values: done | todo | exempt.
rules:
  # Bronze
  action-setup: todo
  appropriate-polling: done
  brands: todo
  common-modules: done
  config-flow: done
  config-flow-test-coverage: todo
  dependency-transparency:
    status: exempt
    comment: No external requirements; the protocol library ships inside the integration.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only subscribe through the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery: todo
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One config entry is one projector.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry is one projector.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Raw TCP protocol, no HTTP session.
  strict-typing: todo
