# Self-tracked Integration Quality Scale checklist.
# The scale is not enforced for custom integrations; it is used here as the
# definition of "done" for each release. Values: done | todo | exempt.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No external requirements; the protocol library ships inside the integration.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only subscribe through the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: todo
    comment: The UDP search reply carries no MAC or serial; zeroconf from the Google TV side still to be checked.
  discovery-update-info:
    status: todo
    comment: Depends on discovery.
  docs-data-update: done
  docs-examples:
    status: todo
    comment: Automation examples planned for v0.1.0.
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: todo
    comment: Planned for v0.1.0.
  dynamic-devices:
    status: exempt
    comment: One config entry is one projector.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: todo
    comment: A likely case is AWOL Link switched off on the projector.
  stale-devices:
    status: exempt
    comment: One config entry is one projector.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Raw TCP protocol, no HTTP session.
  strict-typing:
    status: todo
    comment: The protocol library is checked with mypy strict; the Home Assistant code is not yet.
