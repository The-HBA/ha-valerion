name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  library:
    name: Protocol library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_dev.txt
      - run: pytest

  home-assistant:
    name: Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test_ha.txt
      # Coverage of the Home Assistant code; the library job covers lib/.
      - run: pytest tests/ha --cov=custom_components/valerion --cov-report=term-missing
